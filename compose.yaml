services:
  pitchamon.api:
    image: pitchamon.api
    build:
      context: .
      dockerfile: api/pitchamon.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=pokemon;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: pokemon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s