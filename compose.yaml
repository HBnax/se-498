services:
  pitchamon.api:
    image: pitchamon.api
    build:
      context: .
      dockerfile: api/pitchamon.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=pokemon;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Auth__BearerToken=${AUTH_BEARER_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pokemon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    image: pitchamon.backend
    build:
      context: .
      dockerfile: backend/pitchamon.Backend/Dockerfile
    environment:
        - ConnectionStrings__DefaultConnection=Host=backend-db;Port=5432;Database=pitchamon;Username=postgres;Password=password
        - PokemonApi__BaseUrl=http://pitchamon.api:8080
        - PokemonApi__BearerToken=${AUTH_BEARER_TOKEN}
        - LotrApi__BaseUrl=http://host.containers.internal:8090
        - LotrApi__BearerToken=
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://0.0.0.0:8081
    depends_on:
      backend-db:
        condition: service_healthy
      pitchamon.api:
        condition: service_started
    ports:
      - "8081:8081"

  backend-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pitchamon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
      - ./backend-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  frontend:
    image: pitchamon.frontend
    build: 
      context: ./frontend/pitchamon
      dockerfile: Dockerfile
    environment:
      - VITE_BACKEND_URL=http://localhost:8081
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  api-postgres-data:
  backend-postgres-data:
