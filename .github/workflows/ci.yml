on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test-dotnet:
    name: Build and Test .NET Projects
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore solution
        run: dotnet restore pitchamon.sln
      
      - name: Build solution
        run: dotnet build pitchamon.sln --no-restore --configuration Release

      - name: Run API Tests
        run: dotnet test api/pitchamon.Api.Tests/pitchamon.Api.Tests.csproj --no-build --configuration Release
        
      - name: Run Backend Tests
        run: dotnet test backend/pitchamon.Backend.Tests/pitchamon.Backend.Tests.csproj --no-build --configuration Release

  validate-api-db:
    name: Validate API Database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pokemon_cries
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore API dependencies
        run: dotnet restore api/pitchamon.Api/pitchamon.Api.csproj

      - name: Build API
        run: dotnet build api/pitchamon.Api/pitchamon.Api.csproj --no-restore --configuration Release

      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://0.0.0.0:8080
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=pokemon_cries;Username=postgres;Password=password
          Auth__BearerToken: ci-test-token
        run: |
          dotnet run --project api/pitchamon.Api/pitchamon.Api.csproj > api.log 2>&1 &
          sleep 20

      - name: Verify API endpoint works
        run: 'curl --fail -H "Authorization: Bearer ci-test-token" http://localhost:8080/pokemon'

      - name: Verify cry endpoint works
        run: 'curl --fail -H "Authorization: Bearer ci-test-token" http://localhost:8080/pokemon/pikachu/cry --output 025.wav'

      - name: Show API log on failure
        if: failure()
        run: cat api.log

  validate-backend-db-schema:
    name: Validate Backend DB Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pitchamon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply backend schema
        env:
          PGPASSWORD: password
        run: psql -h localhost -U postgres -d pitchamon -f backend-db/init.sql

      - name: Verify users table exists
        env:
          PGPASSWORD: password
        run: psql -h localhost -U postgres -d pitchamon -c "\dt users"

      - name: Verify processing_history table exists
        env:
          PGPASSWORD: password
        run: psql -h localhost -U postgres -d pitchamon -c "\dt processing_history"

  build-frontend:
    name: Build Frontend
    runs-on: unbuntu-latest
    
    defaults:
      run:
        working-directory: frontend/pitchamon
        
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: frontend/pitchamon/package-lock.json
            
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build
  
  build-containers:
    name: Validate Containers
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Validate compose file
        run: docker compose -f compose.yaml config

      - name: Build API container
        run: docker build -f api/pitchamon.Api/Dockerfile -t pitchamon-api-ci .
        
      - name: Buiild Backend container
        run: docker build -f backend/pitchamon.Backend/Dockerfile -t pitchamon-backend-ci .
        
      - name: Build Frontend container
        run: docker build -f frontend/pitchamon/Dockerfile -t pitchamon-frontend-ci frontend/pitchamon
